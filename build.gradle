plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.171'
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

version = mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_named
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        workingDirectory project.file('run')

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource sourceSets.main
    }

    client {
        programArguments.addAll '--quickPlaySingleplayer', 'New World'
    }

    server {
        programArgument '--nogui'
    }
}

repositories {
    mavenLocal()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'HellFirePvP'
        url = 'https://maven.hellfiredev.net/'
        content { includeGroup 'hellfirepvp.observerlib' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\..*' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    implementation("curse.maven:astral-sorcery-241721:${astralsorcery_curse_file}") { transitive = false }
    implementation("hellfirepvp.observerlib:ObserverLib:${observerlib_version}") { transitive = false }

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            issue_tracker              : issue_tracker,
            kubejs_version_range       : kubejs_version_range,
            astralsorcery_version_range: astralsorcery_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:none'
    options.warnings = false
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
